  <form class="contact-form" id="contact-form" novalidate>
    <div class="cf-row">
      <label>Name<input name="name" autocomplete="name" required maxlength="100"></label>
      <label>Company <span>(optional)</span><input name="company" autocomplete="organization" maxlength="120"></label>
    </div>
    <div class="cf-row">
      <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label>Phone <span>(optional)</span><input name="phone" type="tel" autocomplete="tel" maxlength="40"></label>
    </div>
    <label>How can I help?<textarea name="message" rows="5" required maxlength="5000"></textarea></label>
    <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
    <div class="cf-actions">
      <button class="btn" type="submit">Send message</button>
      <p class="cf-status" role="status" aria-live="polite"></p>
    </div>
    <p class="cf-note">Please don't include passwords or other sensitive details in this form.</p>
  </form>
